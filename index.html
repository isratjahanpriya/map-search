<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Search</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 12px; }
  h1 { font-size: 1.5rem; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  input { padding: 8px; flex: 1; min-width: 140px; font-size: 1rem; }
  button { padding: 8px 20px; font-size: 1rem; cursor: pointer; }
  iframe { width: 100%; height: 450px; border: 1px solid #999; }
</style>
</head>
<body>
  <h1>Search an address on the map</h1>

  <div class="row">
    <input type="text" id="street" placeholder="Street (e.g. Mukkulankatu 19)">
    <input type="text" id="city" placeholder="City (e.g. Lahti)">
    <button onclick="searchMap()">Search</button>
  </div>

  <iframe id="mapFrame" title="Google Map"
    src="https://www.google.com/maps?q=Lahti,Finland&output=embed"
    allowfullscreen loading="lazy"></iframe>

  <script>
    function searchMap() {
      var street = document.getElementById("street").value.trim();
      var city = document.getElementById("city").value.trim();

      if (street === "" && city === "") {
        alert("Please type a street and/or a city.");
        return;
      }

      var address = encodeURIComponent(street + ", " + city);
      document.getElementById("mapFrame").src =
        "https://www.google.com/maps?q=" + address + "&output=embed";
    }

    // Allow pressing Enter in either field
    document.querySelectorAll("input").forEach(function (box) {
      box.addEventListener("keydown", function (e) {
        if (e.key === "Enter") searchMap();
      });
    });
  </script>
</body>
</html>
